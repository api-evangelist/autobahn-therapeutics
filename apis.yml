aid: autobahn-therapeutics
name: Autobahn Therapeutics
description: >-
  Autobahn Therapeutics is a clinical-stage biopharmaceutical company based in San Diego,
  California, developing regenerative medicines for central nervous system (CNS) disorders.
  The company pairs a proprietary brain-targeting chemistry platform - which creates orally
  administered small-molecule prodrugs designed to cross the blood-brain barrier - with
  validated human biology and biomarker-driven development strategies. Its pipeline includes
  elunetirom (its lead clinical program, being developed for indications such as bipolar
  depression), ABX-101 (a next-generation CNS-active S1P molecule), and ABX-003. Autobahn is
  backed by venture investors including Canaan Partners and Insight Partners. This profile is
  maintained in the API Evangelist network; the company does not currently publish a public
  developer API, so this record captures company identity and published web properties only.
